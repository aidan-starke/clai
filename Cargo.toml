[package]
name = "clai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clai"
path = "src/main.rs"

[lib]
name = "clai"
path = "src/lib.rs"

[workspace]
members = [".", "entity", "migration"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sea-orm = { version = "1.1", features = [
	"sqlx-sqlite",
	"runtime-tokio-rustls",
	"macros",
	"chrono",
	"debug-print",
] }

[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sea-orm = { version = "1.1", features = [
	"sqlx-sqlite",
	"runtime-tokio-rustls",
	"macros",
	"chrono",
	"debug-print",
] }
sea-orm-migration = "1.1"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
indicatif = "0.18.0"
console = "0.16.0"
envy = "0.4.2"
dotenv = "0.15.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
axum-test = "17.3.0"
async-trait = "0.1.88"
