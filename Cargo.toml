[package]
name = "clai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clai"
path = "src/main.rs"

[lib]
name = "clai"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
diesel = { version = "2.1", features = ["sqlite", "chrono"] }
diesel_migrations = "2.1"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
indicatif = "0.18.0"
console = "0.16.0"
envy = "0.4.2"
dotenv = "0.15.0"

[dev-dependencies]
axum-test = "17.3.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = "2.0.104"
tempfile = "3.20.0"
tokio-test = "0.4.4"
test_macros = { path = "test_macros" }
timewarp = "0.4.0"
